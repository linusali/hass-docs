<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="35" font-size="22" font-weight="bold" text-anchor="middle" fill="#1a1a1a">How it fits together (simple view)</text>

  <!-- Phone -->
  <rect x="40" y="90" width="150" height="80" rx="10" fill="#eef5ff" stroke="#2563eb" stroke-width="2"/>
  <text x="115" y="125" font-size="15" text-anchor="middle" fill="#1a1a1a">Your phone</text>
  <text x="115" y="145" font-size="15" text-anchor="middle" fill="#1a1a1a">(HA app)</text>

  <!-- Internet cloud -->
  <ellipse cx="330" cy="130" rx="90" ry="45" fill="#f5f5f5" stroke="#888" stroke-width="2"/>
  <text x="330" y="135" font-size="15" text-anchor="middle" fill="#1a1a1a">Internet</text>
  <text x="330" y="190" font-size="12" text-anchor="middle" fill="#666">(only if you turn on</text>
  <text x="330" y="205" font-size="12" text-anchor="middle" fill="#666">remote access - optional)</text>

  <!-- Home Assistant Brain box -->
  <rect x="470" y="250" width="360" height="140" rx="12" fill="#eafbea" stroke="#16a34a" stroke-width="3"/>
  <text x="650" y="280" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">The "Brain"</text>
  <text x="650" y="302" font-size="14" text-anchor="middle" fill="#1a1a1a">Home Assistant</text>
  <text x="650" y="322" font-size="13" text-anchor="middle" fill="#444">running on a small computer</text>
  <text x="650" y="340" font-size="13" text-anchor="middle" fill="#444">(Raspberry Pi) in your unit</text>
  <text x="650" y="365" font-size="12" text-anchor="middle" fill="#888">replaces the old TIS Control panel</text>

  <!-- Devices -->
  <rect x="500" y="430" width="90" height="60" rx="8" fill="#fff7e6" stroke="#d97706" stroke-width="2"/>
  <text x="545" y="465" font-size="13" text-anchor="middle" fill="#1a1a1a">Lights</text>

  <rect x="605" y="430" width="90" height="60" rx="8" fill="#fff7e6" stroke="#d97706" stroke-width="2"/>
  <text x="650" y="458" font-size="13" text-anchor="middle" fill="#1a1a1a">Switches /</text>
  <text x="650" y="474" font-size="13" text-anchor="middle" fill="#1a1a1a">Curtains</text>

  <rect x="710" y="430" width="90" height="60" rx="8" fill="#fff7e6" stroke="#d97706" stroke-width="2"/>
  <text x="755" y="458" font-size="13" text-anchor="middle" fill="#1a1a1a">Air</text>
  <text x="755" y="474" font-size="13" text-anchor="middle" fill="#1a1a1a">Conditioning</text>

  <!-- Old panel crossed out, for context -->
  <rect x="40" y="250" width="160" height="90" rx="10" fill="#fdeaea" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="120" y="280" font-size="14" text-anchor="middle" fill="#7a1a1a">Old TIS Control</text>
  <text x="120" y="298" font-size="14" text-anchor="middle" fill="#7a1a1a">panel</text>
  <text x="120" y="320" font-size="12" text-anchor="middle" fill="#7a1a1a">(replaced)</text>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#555"/>
    </marker>
  </defs>

  <line x1="190" y1="130" x2="240" y2="130" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="150" x2="500" y2="245" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="650" y1="390" x2="650" y2="425" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="620" y1="415" x2="555" y2="428" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="415" x2="745" y2="428" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="900" y="515" font-size="1" fill="#fff">.</text>
</svg>
